<span class="badge-profile" [ngClass]="badgeClass" [style.width.px]="size" [style.height.px]="size"
      [attr.aria-label]="badge + ' badge profile picture'" [title]="badge + ' badge'">
  <span class="badge-profile__ring" aria-hidden="true"></span>
  <img *ngIf="imageUrl" [src]="imageUrl" alt="Profile picture" />
  <i *ngIf="!imageUrl" class="fa fa-user" aria-hidden="true"></i>
</span>
